# Sync the merida-starter repo with this repo automatically

# Inspired by chirpy-starter workflow and the following post by Natalie Somersall
# https://some-natalie.dev/blog/multi-repo-actions/

name: Sync starter repo

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jekyll-theme-merida repo
        uses: actions/checkout@v6
        with:
          path: theme

      - name: Checkout merida-starter repo
        uses: actions/checkout@v6
        with:
          repository: j0m0k0/merida-starter
          path: starter
          token: ${{ secrets.MERIDA_STARTER_SYNC_TOKEN }}

      - name: Copy selected files to starter
        run: |
          rm -rf \
            starter/_bibliography \
            starter/_data \
            starter/_news \
            starter/_pages \
            starter/_plugins \
            starter/_posts \
            starter/downloads

          mkdir -p \
            starter/_bibliography \
            starter/_data \
            starter/_news \
            starter/_pages \
            starter/_plugins \
            starter/_posts \
            starter/downloads

          cp -R theme/_bibliography/. starter/_bibliography
          cp -R theme/_data/. starter/_data
          cp -R theme/_news/. starter/_news
          cp -R theme/_pages/. starter/_pages
          cp -R theme/_plugins/. starter/_plugins
          cp -R theme/_posts/. starter/_posts
          cp -R theme/downloads/. starter/downloads
          {
            printf '%s\n' 'theme: jekyll-theme-merida'
            cat theme/_config.yml
          } > starter/_config.yml

      - name: Create the Gemfile for starter
        run: |
          cat > starter/Gemfile.new <<'EOF'
          # frozen_string_literal: true
          source "https://rubygems.org"

          gem "jekyll-theme-merida", "~> 0.0"
          EOF

          mv starter/Gemfile.new starter/Gemfile

      - name: Read theme version
        id: theme_version
        run: echo "version=$(node -p "require('./theme/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.MERIDA_STARTER_SYNC_TOKEN }}
          path: starter
          branch: sync-from-theme
          commit-message: Sync merida-starter files from jekyll-theme-merida v${{ steps.theme_version.outputs.version }}
          title: Sync merida-starter files from jekyll-theme-merida v${{ steps.theme_version.outputs.version }}
          body: |
            This PR syncs starter files from the `jekyll-theme-merida` repository.

            Synced theme version: `v${{ steps.theme_version.outputs.version }}`
          base: main
