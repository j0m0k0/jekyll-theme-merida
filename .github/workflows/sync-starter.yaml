name: Sync starter repo

on:
  push:
    branches:
      - main
jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jekyll-theme-merida repo
        uses: actions/checkout@v6
        with:
          path: theme

      - name: Checkout merida-starter repo
        uses: actions/checkout@v6
        with:
          repository: j0m0k0/merida-starter
          path: starter
          token: ${{ secrets.MERIDA_STARTER_SYNC_TOKEN }}

      - name: Copy selected files to starter
        run: |
          cp -r theme/_bibliography starter/_bibliography
          cp -r theme/_data starter/_data
          cp -r theme/_includes starter/_includes
          cp -r theme/_layouts starter/_layouts
          cp -r theme/_news starter/_news
          cp -r theme/_pages starter/_pages
          cp -r theme/_plugins starter/_plugins
          cp -r theme/_posts starter/_posts
          cp -r theme/assets starter/assets
          cp -r theme/downloads starter/downloads
          cp -r theme/_sass starter/_sass
          cp theme/_config.yaml starter/_config.yaml
